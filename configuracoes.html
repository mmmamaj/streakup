@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap');

:root {

[hidden] { display: none !important; }

.nav { position: fixed; z-index: 5; right: 50%; bottom: 18px; display: grid; grid-template-columns: repeat(4, 1fr); width: min(calc(100% - 32px), 688px); transform: translateX(50%); overflow: hidden; background: rgba(17,17,17,.92); border: 1px solid #303030; border-radius: 16px; box-shadow: 0 14px 38px rgba(0,0,0,.5); backdrop-filter: blur(16px); }

.stories-bar { display:flex; gap:12px; overflow-x:auto; padding:4px 2px 14px; scrollbar-width:none; }.stories-bar::-webkit-scrollbar { display:none; }.story-trigger { display:grid; justify-items:center; gap:5px; min-width:66px; color:var(--muted); background:transparent; border:0; cursor:pointer; font-size:11px; }.story-ring { display:grid; place-items:center; width:58px; height:58px; padding:3px; background:linear-gradient(135deg,#ff4d68,#ffb21c,#9d5cff); border-radius:50%; }.story-ring img,.story-ring span { display:grid; place-items:center; width:100%; height:100%; color:var(--text); background:var(--surface-2); border-radius:50%; object-fit:cover; }.story-plus { font-size:24px; }.story-viewer { position:fixed; z-index:60; inset:0; display:none; place-items:center; padding:20px; background:rgba(0,0,0,.88); }.story-viewer.open { display:grid; }.story-viewer img { max-width:min(92vw,520px); max-height:82vh; border-radius:18px; object-fit:contain; }.story-viewer button { position:absolute; top:20px; right:20px; width:42px; padding:0; color:#fff; background:#ffffff22; border:1px solid #ffffff55; }
.avatar-upload input[type=file] { min-height:auto; padding:8px 0; border:0; background:transparent; }.privacy-choice { display:flex; align-items:center; gap:10px; padding:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; }.privacy-choice input { width:18px; min-height:18px; accent-color:#ff5b68; }.password-meter { height:7px; margin-top:-7px; margin-bottom:14px; overflow:hidden; background:var(--surface-3); border-radius:99px; }.password-meter i { display:block; width:0; height:100%; background:#f3425f; transition:width .2s,background .2s; }
<style>#bio{width:100%;min-height:78px;padding:10px 12px;color:var(--text);background:var(--surface-2);border:1px solid var(--border-light);border-radius:10px;resize:vertical;font:inherit}</style><script src="/assets/js/theme.js"></script><link rel="stylesheet" href="/assets/css/theme-fix.css"></head><body><main class="app social-app"><header class="social-head"><a class="brand" href="/perfil"><span class="brand-mark"><img class="brand-logo" src="/assets/images/streakup-logo.png" alt=""></span><span class="brand-text">StreakUp</span></a><div style="display:flex;gap:8px;align-items:center"><button class="theme-button" data-theme-toggle aria-label="Alternar tema">☼</button><button class="botao secundario" id="logoutButton" type="button">Sair</button></div></header><section class="settings-card"><div class="eyebrow">Sua conta</div><h1 class="settings-title">Meu perfil</h1><div class="avatar-upload"><div class="avatar" id="avatarPreview">V</div><div><strong id="profileName">Seu nome</strong><div class="muted" id="profileUsername">@usuario</div></div></div><form id="profileForm"><div class="field"><label for="displayName">Nome de exibição</label><input id="displayName" required maxlength="60"></div><div class="field"><label for="bio">Bio</label><textarea id="bio" maxlength="160" placeholder="Conte um pouco sobre você"></textarea></div><div class="field"><label for="username">Nome de usuário</label><input id="username" required maxlength="30" placeholder="seu_usuario"><p class="settings-note">Seu nome de usuário será usado para encontrar você.</p></div><div class="field"><label for="avatarFile">Foto de perfil</label><input id="avatarFile" type="file" accept="image/*"><p class="settings-note">Envie uma foto direto do seu dispositivo.</p></div><label class="privacy-choice"><input id="publicProfile" type="checkbox"> <span><strong>Perfil público</strong><small class="muted" style="display:block">Quando desmarcado, somente seus seguidores veem seus posts.</small></span></label><div class="settings-actions"><button class="botao" type="submit">Salvar perfil</button></div><div id="profileStatus" role="status"></div></form></section><section class="settings-card"><div class="eyebrow">Segurança</div><h2 class="settings-title" style="margin-top: 6px">Alterar senha</h2><form id="passwordForm"><div class="field"><label for="currentPassword">Senha atual</label><input id="currentPassword" type="password" required></div><div class="field"><label for="newPassword">Nova senha</label><input id="newPassword" type="password" minlength="10" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{10,}" required></div><button class="botao" type="submit">Atualizar senha</button><div id="passwordStatus" role="status"></div></form></section><nav class="nav" aria-label="Navegação"><a href="/perfil">⌂<br>For You</a><a href="/perfil#searchResults">⌕<br>Pesquisar</a><a class="post-center" href="/perfil#postComposer">＋<br>Postar</a><a href="/chat">◌<br>Mensagens</a><a class="active" href="/configuracoes">◉<br>Perfil</a></nav></main><script src="/assets/js/settings.js"></script><script>initThemeButton();</script><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script></body></html>
