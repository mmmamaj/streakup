<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar perfil — StreakUp</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="brand"><span class="brand-mark">🔥</span>StreakUp</div>
        <div class="handle">Sua jornada começa agora</div>
      </div>
    </header>

    <section class="form-card" aria-labelledby="page-title">
      <div class="eyebrow">Seu espaço na comunidade</div>
      <h1 id="page-title" style="margin: 6px 0 8px">Criar seu perfil</h1>
      <p class="muted" style="margin-bottom: 22px">Escolha como você quer aparecer para outras pessoas na rede.</p>
      {% if erro %}<div class="erro" role="alert">{{ erro }}</div>{% endif %}
      <form method="POST">
        <div class="field"><label for="nome">Nome exibido</label><input id="nome" type="text" name="nome" placeholder="Seu nome" required></div>
        <div class="field"><label for="username">Nome de usuário</label><input id="username" type="text" name="username" placeholder="@nome_de_usuario" required></div>
        <p class="helper">Seu nome de usuário será usado para outras pessoas encontrarem seu perfil.</p>
        <button class="botao" type="submit">Criar perfil <span aria-hidden="true">→</span></button>
      </form>
    </section>

    <nav class="nav" aria-label="Navegação principal">
      <a class="active" href="/">🏠<br>Início</a><a href="/pesquisar">🔎<br>Pesquisar</a><a href="/ranking">🏆<br>Ranking</a><a href="/perfil">👤<br>Perfil</a>
    </nav>
  </main>
</body>
</html>
