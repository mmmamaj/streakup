<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: white;
    }

    .card {
      width: 92%;
      max-width: 400px;
      padding: 30px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 38px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #303030;
      background: #191919;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #666;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      margin-top: 16px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Criar conta</h1>

    <form id="registerForm">

      <input
        id="name"
        type="text"
        placeholder="Nome"
        required
      >

      <input
        id="email"
        type="email"
        placeholder="E-mail"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Senha"
        required
      >

      <button id="submitButton" type="submit">
        Criar conta
      </button>

    </form>

    <div id="status"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
