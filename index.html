<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crie sua conta no StreakUp e transforme seus objetivos em progresso social.">
  <title>Criar conta — StreakUp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app app--auth">
    <section class="auth-card" aria-labelledby="page-title">
      <div class="auth-top">
        <div class="brand"><span class="brand-mark">🔥</span>StreakUp</div>
        <p>Conecte-se, evolua e mantenha sua sequência.</p>
      </div>

      <div class="eyebrow">Comece agora</div>
      <h1 id="page-title" style="margin: 6px 0 22px">Criar conta</h1>

      <form id="registerForm">
        <div class="field">
          <label for="name">Nome</label>
          <input id="name" type="text" placeholder="Como devemos chamar você?" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="voce@email.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" type="password" placeholder="Crie uma senha segura" autocomplete="new-password" required>
        </div>
        <button id="submitButton" type="submit">Criar minha conta <span aria-hidden="true">→</span></button>
      </form>
      <div id="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
