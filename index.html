<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Teste</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080808;color:#fff}
.card{width:min(92%,400px);padding:28px;background:#111;border:1px solid #292929;border-radius:16px}
h1{text-align:center;margin:0 0 22px}
input{width:100%;padding:14px;margin:0 0 12px;background:#191919;border:1px solid #303030;border-radius:9px;color:#fff;outline:0}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#fff;color:#000;font-weight:700;cursor:pointer}
#status{text-align:center;margin-top:14px;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>Criar conta</h1>
<form id="registerForm">
<input id="name" placeholder="Nome" required>
<input id="email" type="email" placeholder="E-mail" required>
<input id="password" type="password" placeholder="Senha" required>
<button>Criar conta</button>
</form>
<div id="status"></div>
</div>
<script src="./script.js"></script>
</body>
</html>
